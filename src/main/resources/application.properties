spring.application.name=b2b-ecommerce
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/buyogo_platform
spring.datasource.username=user
spring.datasource.password=password

# Hibernate Settings (The Magic part)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.data.mongodb.uri=mongodb://localhost:27017/buyogo_catalog
# Creates the unique index on Product.sku
spring.data.mongodb.auto-index-creation=true

# Redis & Kafka
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092